{{- if .Values.pushgateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  # rapid/format.yaml hardcodes the result-push target as
  # http://pushgateway:9091/metrics/job/rapid/ with no override mechanism,
  # so the Service below (and this Deployment, for consistency) is
  # deliberately named exactly "pushgateway" -- not prefixed with
  # prox.fullname like the rest of this chart's resources -- so that
  # unqualified name resolves for the controller pod in this namespace.
  # One consequence: only one release per namespace can usefully enable
  # this (a second release's controller would push into the same gateway).
  name: pushgateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prox.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushgateway
        app.kubernetes.io/component: pushgateway
    spec:
      containers:
        - name: pushgateway
          image: "{{ .Values.pushgateway.image.repository }}:{{ .Values.pushgateway.image.tag }}"
          imagePullPolicy: {{ .Values.pushgateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9091
          resources:
            {{- toYaml .Values.pushgateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prox.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
spec:
  selector:
    app.kubernetes.io/name: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
{{- end }}
