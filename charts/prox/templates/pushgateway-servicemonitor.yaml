{{- if and .Values.pushgateway.enabled .Values.pushgateway.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "prox.fullname" . }}-pushgateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prox.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
    {{- with .Values.pushgateway.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "prox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pushgateway
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.pushgateway.serviceMonitor.interval }}
      # Pushed metrics already carry their own "job"/"instance" labels
      # (e.g. job="rapid", set by runrapid.py's push URL, see
      # rapid/format.yaml). Without honorLabels, Prometheus's default
      # relabeling overwrites those with this scrape target's own identity
      # (job="pushgateway") and renames the originals to exported_job/
      # exported_instance instead -- not what you want when querying by
      # job="rapid" in Grafana.
      honorLabels: true
{{- end }}
